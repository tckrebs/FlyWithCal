<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 4" shape-rendering="crispEdges">
  <!-- Repeating 8x4 pixel tile for the top edge of the footer:
       bright grass with a few highlights, tufts hanging into the darker green. -->
  <g fill="#4caf3c">
    <rect x="0" y="0" width="8" height="2"/>
    <rect x="0" y="2" width="4" height="1"/>
    <rect x="5" y="2" width="3" height="1"/>
    <rect x="1" y="3" width="2" height="1"/>
    <rect x="6" y="3" width="1" height="1"/>
  </g>
  <g fill="#7fd35a">
    <rect x="1" y="0" width="1" height="1"/>
    <rect x="6" y="0" width="1" height="1"/>
  </g>
</svg>
